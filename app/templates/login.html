<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light"><meta name="theme-color" content="#f8f7ff"><title>Iniciar sesión · Mi viaje</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script defer src="{{ url_for('static', filename='js/avatar.js') }}"></script>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-identity"><span class="login-avatar"><span class="avatar-fallback" aria-hidden="true">M</span><img src="{{ url_for('static', filename='img/mariSprite.png') }}" alt="Avatar de María"></span><span class="brand-name">Mi viaje</span></div>
    <p class="eyebrow">TU VIAJE, BAJO CONTROL</p>
    <h1>Bienvenido</h1>
    <p class="muted">Inicia sesión para consultar y registrar tus gastos.</p>
    {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button class="button primary full" type="submit">Iniciar sesión</button>
    </form>
    <p class="login-foot">Acceso privado · Tus gastos están protegidos</p>
  </main>
</body>
</html>
