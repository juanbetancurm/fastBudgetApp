<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light"><title>Iniciar sesión · Mi viaje</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark" aria-hidden="true">V</div>
    <p class="eyebrow">TU VIAJE, BAJO CONTROL</p>
    <h1>Bienvenido</h1>
    <p class="muted">Inicia sesión para consultar y registrar tus gastos.</p>
    {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button class="button primary full" type="submit">Iniciar sesión</button>
    </form>
    <p class="login-foot">Tus gastos están protegidos.</p>
  </main>
</body>
</html>
