name: fastbudgetapp

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/travel_budget.sqlite3
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      TZ: America/Bogota
    expose:
      - "8000"
    volumes:
      - travel-budget-data:/data
    networks:
      web:
        aliases:
          - viaje-budget
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  travel-budget-data:

networks:
  web:
    external: true
    name: web
