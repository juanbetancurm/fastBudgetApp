# Append this snippet to /home/olav/anglemaze-platform/proxy/nginx.conf.
# The existing proxy mounts its origin certificate at these paths.
upstream viaje_budget_app {
    server viaje-budget:8000;
}

server {
    listen 80;
    server_name viaje.labolavs.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name viaje.labolavs.com;

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    client_max_body_size 1m;

    location / {
        proxy_pass http://viaje_budget_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
